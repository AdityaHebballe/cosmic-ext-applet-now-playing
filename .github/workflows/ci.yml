name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libdbus-1-dev
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run tests
        run: cargo test --all-features
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub org.freedesktop.Sdk//25.08 org.freedesktop.Platform//25.08
      - name: Build Flatpak
        run: flatpak-builder --force-clean flatpak-out flatpak/com.github.DiegoMMR.CosmicExtAppletNowPlaying.json
